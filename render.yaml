services:
  - type: web
    name: ridemate-backend
    runtime: node
    # Build settings for a NestJS app in a pnpm monorepo
    # 1. Install all dependencies from root
    # 2. Generate Prisma client
    # 3. Build the 'api' package
    # 4. Run prisma migrations to sync the database
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter api dlx prisma generate && pnpm --filter api run build && pnpm --filter api dlx prisma migrate deploy
    # Start the production build using pnpm filter to ensure correct working directory
    startCommand: pnpm --filter api run start:prod
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PNPM_VERSION
        value: "10.32.1"
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
